name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build and test without Qt
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild sgraphTests/vp_core_tests.vcxproj /nologo /m /verbosity:minimal `
            /p:Configuration=${{ matrix.config }} /p:Platform=x64 /p:VpCoreOnly=true
          if ($LASTEXITCODE -ne 0) {
            throw 'Core build failed.'
          }
          $exe = Join-Path $PWD "build/msbuild/core/64/${{ matrix.config }}/vectorPathCoreTests.exe"
          & $exe --list-suites | ForEach-Object {
            & $exe $_
            if ($LASTEXITCODE -ne 0) {
              throw "Core suite $_ failed."
            }
          }

  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: "64"
            platform: x64
            config: Release
            qt_arch: win64_msvc2017_64
          - bits: "32"
            platform: Win32
            config: Release
            qt_arch: win32_msvc2017

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Qt 5.12.10
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "5.12.10"
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install pinned Qt MSBuild 3.5.0
        shell: pwsh
        run: |
          $qtMsBuildArchive = Join-Path $env:RUNNER_TEMP 'qt-vsaddin-msbuild-3.5.0.zip'
          $qtMsBuildDirectory = Join-Path $env:RUNNER_TEMP 'QtMsBuild-3.5.0'
          Invoke-WebRequest `
            -Uri 'https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip' `
            -OutFile $qtMsBuildArchive
          $expectedHash = 'e6398999d7e2bacf2cb93839ef24e7a1be851dfc7d6e3dc7dc3e57c8efdb4ed8'
          if ((Get-FileHash -LiteralPath $qtMsBuildArchive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Qt MSBuild archive SHA-256 mismatch.'
          }
          Expand-Archive -LiteralPath $qtMsBuildArchive -DestinationPath $qtMsBuildDirectory
          if (-not (Test-Path -LiteralPath (Join-Path $qtMsBuildDirectory 'qt.targets'))) {
            throw 'Qt MSBuild archive does not contain qt.targets.'
          }
          "QtMsBuild=$qtMsBuildDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build solution
        shell: pwsh
        run: |
          $qtDir = (& qmake -query QT_INSTALL_PREFIX).Trim()
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $properties = @(
            '/p:Configuration=${{ matrix.config }}',
            '/p:Platform=${{ matrix.platform }}',
            "/p:VpQtDir=$qtDir"
          )
          & $msbuild vectorPath.sln /nologo /m /verbosity:minimal @properties
          if ($LASTEXITCODE -ne 0) {
            throw 'Solution build failed.'
          }
          foreach ($project in @(
            'sgraphTests/vp_core_tests.vcxproj',
            'sgraphTests/vp_desktop_tests.vcxproj',
            'sgraphTests/vp_id_collection_benchmark.vcxproj',
            'sgraphVectorBenchmark/vp_bitmap_benchmark.vcxproj'
          )) {
            & $msbuild $project /nologo /m /verbosity:minimal @properties
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed: $project"
            }
          }

      - name: Run test suites
        shell: pwsh
        run: |
          $qtDir = (& qmake -query QT_INSTALL_PREFIX).Trim()
          $output = Join-Path $PWD "build/msbuild/${{ matrix.bits }}/${{ matrix.config }}"
          $env:PATH = "$qtDir\bin;$output;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $qtDir 'plugins\platforms'
          $env:VECTORPATH_LIBREDWG_DIR = Join-Path $PWD 'sgraphThirdParty\libredwg-0.14-win64'

          $coreTests = Join-Path $output 'vectorPathCoreTests.exe'
          & $coreTests --list-suites | ForEach-Object {
            & $coreTests $_
            if ($LASTEXITCODE -ne 0) {
              throw "Core suite $_ failed."
            }
          }

          $desktopTests = Join-Path $output 'vectorPathDesktopTests.exe'
          & $desktopTests --list-suites | ForEach-Object {
            & $desktopTests $_
            if ($LASTEXITCODE -ne 0) {
              throw "Desktop suite $_ failed."
            }
          }

          & (Join-Path $output 'vectorPathIdCollectionBenchmark.exe')
          if ($LASTEXITCODE -ne 0) {
            throw 'ID collection benchmark failed.'
          }

      - name: Run bitmap benchmark smoke
        shell: pwsh
        run: |
          $qtDir = (& qmake -query QT_INSTALL_PREFIX).Trim()
          $output = Join-Path $PWD "build/msbuild/${{ matrix.bits }}/${{ matrix.config }}"
          $env:PATH = "$qtDir\bin;$output;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $resultDirectory = Join-Path $env:RUNNER_TEMP 'vp-bitmap-smoke'
          if (Test-Path -LiteralPath $resultDirectory) {
            Remove-Item -LiteralPath $resultDirectory -Recurse -Force
          }
          & (Join-Path $output 'smartBitmapVectorBenchmark.exe') --smoke --cases 20 --output $resultDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Bitmap benchmark smoke failed.'
          }
          $expected = @('manifest.json', 'bitmap_vector_benchmark_report.html')
          $actual = Get-ChildItem -LiteralPath $resultDirectory -Force | Select-Object -ExpandProperty Name
          if ((Compare-Object $expected $actual)) {
            throw "Unexpected benchmark output: $actual"
          }
          $manifest = Get-Content -LiteralPath (Join-Path $resultDirectory 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.case_count -ne 20 -or $manifest.cases.Count -ne 20) {
            throw 'Bitmap benchmark manifest is incomplete.'
          }
